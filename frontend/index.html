<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCIS-Tactical | National Cyber Crime & Forensics Investigation Platform</title>
    <meta name="description" content="National Cyber Crime & Forensics Investigation System (NCIS-Tactical): High-Speed Criminal Syndicate Analysis, Real-Time Video AI Triage, Dial 100/112 ERSS Mesh & Judicial BNS-63 Warrant Compliance" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CyberKit Police" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <link rel="icon" type="image/png" href="/pwa-icon-192.png" />
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for background push notifications
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[CyberKit] Service Worker registered. Scope:', reg.scope);
            })
            .catch((err) => {
              console.log('[CyberKit] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
