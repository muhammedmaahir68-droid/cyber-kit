apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-kit-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyber-kit-db
  template:
    metadata:
      labels:
        app: cyber-kit-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "cyber_kit_db"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres_password"
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-storage
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cyber-kit-db
spec:
  selector:
    app: cyber-kit-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
